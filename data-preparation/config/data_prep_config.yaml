# Video input directory containing video files to process
input_video_directory: "E:/20251026 18s Race 3"

# Output directory for extracted frames
output_frames_directory: "output/frames"

# Proportion of video to extract frame from (0.0 to 1.0)
# 0.0 = first frame, 0.5 = middle frame, 1.0 = last frame
frame_proportion: 0.5

# Maximum video file size in MB (videos larger than this will be skipped)
max_video_size_mb: 100
