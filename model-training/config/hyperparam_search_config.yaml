# Hyperparameter search configuration for YOLOv8n tracking optimization

search_space:
  # Yolo model inference parameters
  model_config:
    conf: [0.3] # Detection confidence threshold
    classes: [8] # Class IDs to detect (boat only)
    persist: [True] # Persist tracks across frames
    verbose: [False] # Disable verbose output

  botsort_config:
    # Bot-SORT tracker parameters
    tracker_type: [botsort] # Use BoT-SORT for best tracking quality

    # Critical tracking parameters (most impact on performance)
    track_high_thresh: [0.4] # First-stage match threshold
    track_low_thresh: [0.1] # Second-stage threshold
    new_track_thresh: [0.7] # New track threshold
    track_buffer: [30] # Lost track persistence
    match_thresh: [0.7] # Association threshold

    # Less critical - use recommended defaults
    fuse_score: [True] # Always fuse scores for stability
    gmc_method: [sparseOptFlow] # Best for maritime camera motion

    # ReID disabled for initial search
    proximity_thresh: [0.5] # Fixed - standard value
    appearance_thresh: [0.25] # Fixed - standard value
    with_reid: [False] # Disable ReID to reduce complexity
    model: [auto] # Auto-detect
