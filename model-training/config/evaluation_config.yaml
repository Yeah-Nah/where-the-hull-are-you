# Evaluation Configuration

# Model settings
model:
  baseline_model: "yolov8n.pt"
  custom_model: "models/custom/best.pt"
  
# Data paths
data:
  labeled_dataset_yaml: "path/to/labeled/data.yaml"
  unlabeled_videos_dir: "path/to/unlabeled/videos"
  
# Evaluation settings
evaluation:
  tracker_config: "botsort.yaml"
  confidence_threshold: 0.25
  iou_threshold: 0.7
  
# Metrics to compute
metrics:
  labeled:
    - "mAP50"
    - "mAP50-95"
    - "precision"
    - "recall"
    - "MOTA"
    - "IDF1"
  unlabeled:
    - "avg_confidence"
    - "total_tracks"
    - "avg_track_length"
    - "avg_detections_per_frame"
    
# Output settings
output:
  save_metrics: true
  metrics_dir: "output/metrics"
  save_visualizations: false
  visualization_dir: "output/visualizations"
  
# MLflow settings
mlflow:
  experiment_name: "maritime-model-evaluation"
  tracking_uri: "mlruns"
