# Training Configuration

# Model settings
model:
  base_model: "yolov8n.pt"  # Starting point for transfer learning
  architecture: "yolov8"
  
# Data paths
data:
  train_dir: "path/to/train/images"
  val_dir: "path/to/val/images"
  test_dir: "path/to/test/images"
  dataset_yaml: "path/to/data.yaml"
  
# Training hyperparameters
training:
  epochs: 100
  batch_size: 16
  image_size: 640
  learning_rate: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  
# Augmentation
augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.0
  
# Output settings
output:
  project: "runs/train"
  name: "custom_model"
  save_dir: "models/custom"
  
# MLflow settings
mlflow:
  experiment_name: "maritime-model-training"
  tracking_uri: "mlruns"
