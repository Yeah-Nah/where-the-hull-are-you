# Transfer learning configuration for 18ft skiff detection
training:
  # Base model selection to use for transfer learning
  model: "yolov8n.pt"  # Options: yolov8n.pt, yolo11n.pt

  # Essential hyperparameters
  epochs: 2                # Number of training epochs
  batch: 16            # Batch size (reduce if out of memory)
  imgsz: 640                # Input image size
  lr0: 0.01                 # Initial learning rate

  rect: True                # Use rectangular training (preserve aspect ratio)

  classes: [0]           # The class or classes to train on (0 for single class, or list of class indices)

  # Output settings
  training_run_name: "18ft_skiff_v1" # Will have datetime appened for uniqueness
  exist_ok: True
