# High Confidence Experiment Configuration
# Optimized for precision over recall with stricter thresholds

experiment_name: high_confidence

# Higher detection confidence threshold to reduce false positives
confidence_threshold: 0.7

# Video preprocessing target height (pixels)
target_height: 720

# Tracker type
tracker_type: botsort

# BOTSORT tracker configuration
botsort_config:
  # Higher track confidence threshold
  track_thresh: 0.6
  
  # Number of frames to keep lost tracks
  track_buffer: 30
  
  # Higher matching threshold for stricter association
  match_thresh: 0.85
  
  # Detection threshold
  det_thresh: 0.6
