# Baseline Experiment Configuration
# Standard settings for boat tracking with moderate confidence and buffer

experiment_name: baseline

# Detection confidence threshold
confidence_threshold: 0.5

# Video preprocessing target height (pixels)
target_height: 720

# Tracker type
tracker_type: botsort

# BOTSORT tracker configuration
botsort_config:
  # Track confidence threshold
  track_thresh: 0.5
  
  # Number of frames to keep lost tracks
  track_buffer: 30
  
  # Matching threshold for data association
  match_thresh: 0.8
  
  # Detection threshold
  det_thresh: 0.5
