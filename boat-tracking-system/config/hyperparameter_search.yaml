# Grid Search Configuration for Boat Tracking Hyperparameter Tuning
# This file defines a grid search over multiple hyperparameter values

search_type: grid

parameters:
  # Detection confidence threshold
  confidence_threshold: [0.3, 0.5, 0.7]
  
  # Video preprocessing target height
  target_height: [480, 720, 1080]
  
  # Tracker type (currently only botsort supported)
  tracker_type: botsort
  
  # BOTSORT tracker configuration parameters
  botsort_config:
    # Track confidence threshold
    track_thresh: [0.25, 0.5, 0.75]
    
    # Number of frames to keep lost tracks
    track_buffer: [30, 60, 90]
    
    # Matching threshold for data association
    match_thresh: [0.7, 0.8, 0.9]
    
    # Detection threshold (typically same as confidence_threshold)
    # det_thresh: [0.3, 0.5, 0.7]

# Note: The above configuration will generate 3 x 3 x 3 x 3 x 3 = 243 experiment runs
# Consider reducing the parameter space for faster experimentation
